# =============================================================================
# 自定义WAF规则配置文件
# =============================================================================
# 说明：
# - 这些规则会与OWASP CRS规则一起加载
# - 请避免与CRS规则重复，专注于业务特定需求
# - 规则ID使用2001-2999范围，避免与CRS冲突
# =============================================================================

# =============================================================================
# 管理路径访问控制
# =============================================================================
# 禁止直接访问管理后台路径
SecRule REQUEST_URI "@beginsWith /admin" \
    "id:2001,phase:1,deny,status:403,msg:'Admin access denied',log,tag:'business-policy'"

# =============================================================================
# API安全控制
# =============================================================================
# 要求API密钥认证：如果请求头中没有API密钥，拒绝访问
SecRule REQUEST_HEADERS:X-API-Key "@rx ^$" \
    "id:2002,phase:1,deny,status:401,msg:'API key required',log,tag:'api-security'"

# =============================================================================
# 输入参数验证
# =============================================================================
# 用户ID格式验证：必须是数字
SecRule ARGS:userId "!@rx ^[0-9]+$" \
    "id:2003,phase:2,deny,status:400,msg:'Invalid userId format',log,tag:'input-validation'"

# =============================================================================
# 业务逻辑控制
# =============================================================================
# 禁止删除操作：根据业务需求禁用DELETE方法
SecRule REQUEST_METHOD "@streq DELETE" \
    "id:2004,phase:1,deny,status:403,msg:'Delete operations not allowed',log,tag:'business-policy'"

# =============================================================================
# 文件上传安全
# =============================================================================
# 检测文件上传请求并设置多部分处理器
SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" \
    "id:2005,phase:1,ctl:requestBodyProcessor=MULTIPART,nolog,pass"

# 禁止上传可执行文件
SecRule FILES:fileName "@rx \.(php|jsp|asp|sh|exe|bat|cmd)$" \
    "id:2006,phase:2,deny,status:403,msg:'Executable file upload denied',log,tag:'upload-security'"

# =============================================================================
# IP白名单控制
# =============================================================================
# 注意：Coraza的REMOTE_ADDR使用r.RemoteAddr（直连IP），不是应用层getClientIP
# 解析的真实客户端IP。在反向代理场景下，REMOTE_ADDR是代理IP而非客户端IP。
# IP白名单应通过应用层配置（waf.whitelist.ip_ranges）实现，不要在CRS规则中
# 使用REMOTE_ADDR + ctl:ruleEngine=Off，否则可能导致WAF被意外禁用。
# 如需基于真实客户端IP的访问控制，请在应用层白名单中配置。

