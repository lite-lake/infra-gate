<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>访问验证</title>
<!-- 轻湖网关公共页 · 共享骨架 v1（内部PRD P3 / D10）
     零外部依赖单文件内联（docs/brands/frontend-design.md §10.3）；
     令牌取值源 §3.2 墨阶 / §4 排印 / §5 圆角；tile 源 docs/brands/lite-lake/logo-tile.svg
     修改本骨架须五处同步：templates/blocked.html / system_error.html / upstream_error.html / internal/templates/renderer.go(fallback)
     表单结构与提交脚本为行为层（内部PRD 契约），除视觉外零改动 -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%231C1C1C'/%3E%3Cstop offset='1' stop-color='%23141414'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='20' y1='30' x2='76' y2='66' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23F5F2EC'/%3E%3Cstop offset='1' stop-color='%238F8F8F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='96' height='96' rx='22' fill='url(%23a)'/%3E%3Cg fill='none' stroke-width='6.5' stroke-linecap='round'%3E%3Cpath d='M20 37.5q14-10 28 0t28 0' stroke='url(%23b)'/%3E%3Cpath d='M20 58.5q14-10 28 0t28 0' stroke='%23BDBDBD' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* —— 墨阶语义令牌子集（§3.2）：亮色 —— */
:root {
  --brand: #1A1A1A;
  --brand-h: #000000;
  --on-brand: #FFFFFF;
  --ink: #1A1A1A;
  --ink-2: #717171;
  --ink-3: #A6A6A6;
  --bg: #FFFFFF;
  --panel: #FFFFFF;
  --soft: #FAFAFA;
  --wash: #F7F7F7;
  --bd: #EBEBEB;
  --bd-2: #DDDDDD;
  --no: #C13515;
  --no-bg: #FCEEE9;
  --focus: #1A1A1A;
  --sel: #DBDBDB;
  --ring: rgba(26, 26, 26, .2);
  --sh: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px rgba(0, 0, 0, .06);
}

/* —— 暗色：prefers-color-scheme 跟随（§10.3 不设切换交互） —— */
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #ECEAE4;
    --brand-h: #FFFFFF;
    --on-brand: #141518;
    --ink: #F2F3F5;
    --ink-2: #A8ADB5;
    --ink-3: #8A909A;
    --bg: #141518;
    --panel: #1C1E22;
    --soft: #212429;
    --wash: #0F1013;
    --bd: #2B2E34;
    --bd-2: #3D4148;
    --no: #FF8A66;
    --no-bg: rgba(255, 138, 102, .14);
    --focus: #ECEAE4;
    --sel: #3A3E46;
    --ring: rgba(236, 234, 228, .28);
    --sh: 0 1px 2px rgba(0, 0, 0, .45), 0 12px 32px rgba(0, 0, 0, .4);
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--sel); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: none; }
input[type="password"]:focus-visible { border-color: var(--focus); background: var(--panel); box-shadow: 0 0 0 3px var(--ring); }

/* —— 页头：28px tile + 站点语境标题 —— */
.page-head { flex: none; display: flex; align-items: center; gap: 10px; }
.page-head .tile { display: block; }
.page-head .brand { font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--ink); }

/* —— 居中主卡 —— */
.stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
.card {
  background: var(--panel);
  border: 1px solid var(--bd);
  border-radius: 16px;
  box-shadow: var(--sh);
  width: 100%;
  max-width: 420px;
  padding: 44px 28px 36px;
  text-align: center;
}
.icon-wrap {
  width: 56px;
  height: 56px;
  margin: 0 auto 14px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--wash);
  color: var(--ink);
}
h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); margin-bottom: 10px; }
.hint { font-size: 16px; color: var(--ink-2); margin-bottom: 28px; }
input[type="password"] {
  width: 100%;
  font-size: 19px;
  padding: 13px 20px;
  border: 2px solid var(--bd-2);
  border-radius: 999px;
  outline: none;
  text-align: center;
  letter-spacing: .12em;
  color: var(--ink);
  background: var(--soft);
  font-family: inherit;
  transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
}
input[type="password"]:focus { border-color: var(--focus); background: var(--panel); box-shadow: 0 0 0 3px var(--ring); }
button {
  width: 100%;
  margin-top: 16px;
  font-size: 18px;
  padding: 13px;
  background: var(--brand);
  color: var(--on-brand);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 600;
  font-family: inherit;
  transition: background-color .15s ease;
}
button:hover { background: var(--brand-h); }
button:disabled { opacity: .6; cursor: default; }
.msg { min-height: 1.5em; margin-top: 16px; font-size: 15.5px; color: var(--ink-3); }
.msg.err { color: var(--no); font-weight: 600; }
.shake { animation: shake .4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
}

/* —— 页脚屋级落款：tile 小图 + 「轻湖」二字（D10，不用 byline 三态） —— */
.page-foot {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 20px;
  font-size: 13px;
  color: var(--ink-3);
}

@media (max-width: 400px) {
  .card { padding: 36px 20px 30px; }
  h1 { font-size: 20px; }
  input[type="password"] { font-size: 17px; }
  button { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="page-head">
  <svg class="tile" width="28" height="28" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><defs><linearGradient id="tbh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#141414"/></linearGradient><linearGradient id="twh" x1="20" y1="30" x2="76" y2="66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5F2EC"/><stop offset="1" stop-color="#8F8F8F"/></linearGradient></defs><rect width="96" height="96" rx="22" fill="url(#tbh)"/><g fill="none" stroke-width="6.5" stroke-linecap="round"><path d="M20 37.5q14-10 28 0t28 0" stroke="url(#twh)"/><path d="M20 58.5q14-10 28 0t28 0" stroke="#BDBDBD" opacity=".55"/></g></svg>
  <span class="brand">轻湖</span>
</header>

<main class="stage">
<section class="card" id="card">
  <div class="icon-wrap" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h1>访问验证</h1>
  <p class="hint">请输入访问密码继续</p>
  <form id="login-form" method="POST" action="{{.Action}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <input id="password" name="password" type="password" autocomplete="current-password"
           placeholder="访问密码" autofocus required>
    <button type="submit">进 入</button>
    <p id="msg" class="msg{{if .Error}} err{{end}}"{{if .Error}} data-shake="1"{{end}}>{{if .Error}}{{.ErrorText}}{{else}}&nbsp;{{end}}</p>
  </form>
</section>
</main>

<footer class="page-foot">
  <svg class="tile-sm" width="16" height="16" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><defs><linearGradient id="tbf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#141414"/></linearGradient><linearGradient id="twf" x1="20" y1="30" x2="76" y2="66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5F2EC"/><stop offset="1" stop-color="#8F8F8F"/></linearGradient></defs><rect width="96" height="96" rx="22" fill="url(#tbf)"/><g fill="none" stroke-width="6.5" stroke-linecap="round"><path d="M20 37.5q14-10 28 0t28 0" stroke="url(#twf)"/><path d="M20 58.5q14-10 28 0t28 0" stroke="#BDBDBD" opacity=".55"/></g></svg>
  <span>轻湖</span>
</footer>
<script>
(function () {
  var msg = document.getElementById("msg");
  var card = document.getElementById("card");
  var form = document.getElementById("login-form");
  var btn = form.querySelector("button");

  function showMsg(text, isErr) {
    msg.textContent = text;
    msg.className = "msg" + (isErr ? " err" : "");
  }
  function shake() {
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }
  function isRateErr(err) { return err === "rate"; }
  function errText(err) {
    return isRateErr(err) ? "尝试过于频繁，请稍后再试" : "密码错误，请重试";
  }

  // 服务端渲染的错误参数：读取后 history.replaceState 清理 URL（刷新不重复弹错）
  var params = new URLSearchParams(location.search);
  var initErr = params.get("error");
  if (initErr) {
    showMsg(errText(initErr), true);
    if (!isRateErr(initErr)) { shake(); }
    params.delete("error");
    var qs = params.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
  }

  // JS 增强：fetch 提交 + 按最终 URL 的 error 参数行内提示；
  // 无 JS 时 form 原生 POST 同样完整可用（渐进增强）
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    btn.disabled = true;
    showMsg("验证中…", false);
    fetch(form.action, {
      method: "POST",
      // 服务端契约仅解析 application/x-www-form-urlencoded（PRD §6.2）；
      // FormData 会发 multipart，此处转 urlencoded（无 JS 的原生提交本就是 urlencoded）
      body: new URLSearchParams(new FormData(form)),
      redirect: "follow",
      credentials: "same-origin"
    }).then(function (resp) {
      var final = new URL(resp.url);
      var err = final.searchParams.get("error");
      if (err) {
        btn.disabled = false;
        showMsg(errText(err), true);
        if (!isRateErr(err)) { shake(); }
        return;
      }
      // 登录成功：fetch 已跟随 303 到回跳页，cookie 已写入
      location.href = resp.url;
    }).catch(function () {
      btn.disabled = false;
      showMsg("网络异常，请重试", true);
    });
  });
})();
</script>
</body>
</html>
