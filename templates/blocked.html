<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被拦截</title>
    <!-- 轻湖网关公共页 · 共享骨架 v1（内部PRD P3 / D10）
         零外部依赖单文件内联（docs/brands/frontend-design.md §10.3）；
         令牌取值源 §3.2 墨阶 / §4 排印 / §5 圆角；tile 源 docs/brands/lite-lake/logo-tile.svg
         修改本骨架须五处同步：system_error.html / upstream_error.html / internal/auth/page.html / internal/templates/renderer.go(fallback) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%231C1C1C'/%3E%3Cstop offset='1' stop-color='%23141414'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='20' y1='30' x2='76' y2='66' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23F5F2EC'/%3E%3Cstop offset='1' stop-color='%238F8F8F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='96' height='96' rx='22' fill='url(%23a)'/%3E%3Cg fill='none' stroke-width='6.5' stroke-linecap='round'%3E%3Cpath d='M20 37.5q14-10 28 0t28 0' stroke='url(%23b)'/%3E%3Cpath d='M20 58.5q14-10 28 0t28 0' stroke='%23BDBDBD' opacity='.55'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        /* —— 墨阶语义令牌子集（§3.2）：亮色 —— */
        :root {
            --brand: #1A1A1A;
            --brand-h: #000000;
            --on-brand: #FFFFFF;
            --ink: #1A1A1A;
            --ink-2: #717171;
            --ink-3: #A6A6A6;
            --bg: #FFFFFF;
            --panel: #FFFFFF;
            --soft: #FAFAFA;
            --wash: #F7F7F7;
            --bd: #EBEBEB;
            --bd-2: #DDDDDD;
            --no: #C13515;
            --no-bg: #FCEEE9;
            --focus: #1A1A1A;
            --sel: #DBDBDB;
            --ring: rgba(26, 26, 26, .2);
            --sh: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px rgba(0, 0, 0, .06);
        }

        /* —— 暗色：prefers-color-scheme 跟随（§10.3 不设切换交互） —— */
        @media (prefers-color-scheme: dark) {
            :root {
                --brand: #ECEAE4;
                --brand-h: #FFFFFF;
                --on-brand: #141518;
                --ink: #F2F3F5;
                --ink-2: #A8ADB5;
                --ink-3: #8A909A;
                --bg: #141518;
                --panel: #1C1E22;
                --soft: #212429;
                --wash: #0F1013;
                --bd: #2B2E34;
                --bd-2: #3D4148;
                --no: #FF8A66;
                --no-bg: rgba(255, 138, 102, .14);
                --focus: #ECEAE4;
                --sel: #3A3E46;
                --ring: rgba(236, 234, 228, .28);
                --sh: 0 1px 2px rgba(0, 0, 0, .45), 0 12px 32px rgba(0, 0, 0, .4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--ink);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: var(--sel);
        }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        /* —— 页头：28px tile + 站点语境标题 —— */
        .page-head {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-head .tile {
            display: block;
        }

        .page-head .brand {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .02em;
            color: var(--ink);
        }

        /* —— 居中主卡 —— */
        .stage {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--bd);
            border-radius: 16px;
            box-shadow: var(--sh);
            width: 100%;
            max-width: 480px;
            padding: 44px 36px;
            text-align: center;
        }

        .icon-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-err {
            background: var(--no-bg);
            color: var(--no);
        }

        .icon-warn {
            background: var(--wash);
            color: var(--ink);
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.01em;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .message {
            font-size: 15.5px;
            color: var(--ink-2);
            margin-bottom: 22px;
        }

        .details {
            background: var(--soft);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 22px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 5px 0;
            font-size: 14px;
        }

        .detail-label {
            color: var(--ink-2);
            flex: none;
        }

        .detail-value {
            color: var(--ink);
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
            text-align: right;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            padding: 10px 26px;
            border-radius: 999px;
            border: 1px solid var(--bd-2);
            background: var(--panel);
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            transition: border-color .15s ease, background-color .15s ease;
        }

        .btn:hover {
            border-color: var(--ink-3);
            background: var(--soft);
        }

        .note {
            font-size: 13px;
            color: var(--ink-3);
            line-height: 1.7;
        }

        .note p {
            margin: 0;
        }

        .note p + p {
            margin-top: 2px;
        }

        /* —— 页脚屋级落款：tile 小图 + 「轻湖」二字（D10，不用 byline 三态） —— */
        .page-foot {
            flex: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-top: 22px;
            font-size: 13px;
            color: var(--ink-3);
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <header class="page-head">
        <svg class="tile" width="28" height="28" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><defs><linearGradient id="tbh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#141414"/></linearGradient><linearGradient id="twh" x1="20" y1="30" x2="76" y2="66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5F2EC"/><stop offset="1" stop-color="#8F8F8F"/></linearGradient></defs><rect width="96" height="96" rx="22" fill="url(#tbh)"/><g fill="none" stroke-width="6.5" stroke-linecap="round"><path d="M20 37.5q14-10 28 0t28 0" stroke="url(#twh)"/><path d="M20 58.5q14-10 28 0t28 0" stroke="#BDBDBD" opacity=".55"/></g></svg>
        <span class="brand">轻湖</span>
    </header>

    <main class="stage">
        <section class="card">
            <div class="icon-wrap icon-err" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
            </div>
            <h1>访问被拦截</h1>
            <p class="message">
                您的请求已被安全系统拦截，这可能是因为请求包含了潜在的安全风险。
            </p>

            <div class="details">
                <div class="detail-item">
                    <span class="detail-label">状态码</span>
                    <span class="detail-value">{{.StatusCode}}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">追踪ID</span>
                    <span class="detail-value">{{.TraceId}}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">拦截时间</span>
                    <span class="detail-value">{{.Timestamp}}</span>
                </div>
            </div>

            <div class="actions">
                <a href="javascript:history.back()" class="btn">返回上一页</a>
                <a href="/" class="btn">访问首页</a>
            </div>

            <p class="note">
                如有疑问，请联系系统管理员并提供追踪ID
            </p>
        </section>
    </main>

    <footer class="page-foot">
        <svg class="tile-sm" width="16" height="16" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><defs><linearGradient id="tbf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1C"/><stop offset="1" stop-color="#141414"/></linearGradient><linearGradient id="twf" x1="20" y1="30" x2="76" y2="66" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5F2EC"/><stop offset="1" stop-color="#8F8F8F"/></linearGradient></defs><rect width="96" height="96" rx="22" fill="url(#tbf)"/><g fill="none" stroke-width="6.5" stroke-linecap="round"><path d="M20 37.5q14-10 28 0t28 0" stroke="url(#twf)"/><path d="M20 58.5q14-10 28 0t28 0" stroke="#BDBDBD" opacity=".55"/></g></svg>
        <span>轻湖</span>
    </footer>
</body>
</html>
